root: "../out"
schema_version: 1

dataset:
  name: 'comandati'
  source_id: "openbdap"
  years: [2024]

raw:
  output_policy: overwrite
  sources:
    - name: 'comandati_csv'
      type: "local_file"
      args:
        path: '../_local/seed/dati/COMANDATI_FUORI_RUOLO_ESONERI_2024.CSV'
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    mode: latest
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 100

mart:
  tables:
    - name: 'comandati_comparti'
      sql: "sql/mart.sql"
  required_tables:
    - 'comandati_comparti'
  validate:
    table_rules:
      comandati_comparti:
        min_rows: 5

validation:
  fail_on_error: true

support:
  - name: 'enti'
    config: '../anagrafica/anag-enti/dataset.yml'
    years: [2024]
  - name: 'comparti'
    config: '../anagrafica/anag-comparti/dataset.yml'
    years: [2024]
  - name: 'qualifiche'
    config: '../anagrafica/anag-qualifiche/dataset.yml'
    years: [2024]
