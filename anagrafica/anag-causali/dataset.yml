root: "../../out"
schema_version: 1

dataset:
  name: "ca_anag_causali_seed"
  years: [2024]

raw:
  sources:
    - name: "anagrafica_causali_csv"
      type: "local_file"
      args:
        path: "../../_local/seed/Causali.CSV"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    mode: explicit
    header: true
    delim: ";"
    encoding: "utf-8"
  validate: {}

mart:
  tables:
    - name: "ca_anag_causali_seed"
      sql: "sql/mart.sql"
  required_tables: ["ca_anag_causali_seed"]
  validate: {}

validation:
  fail_on_error: true
