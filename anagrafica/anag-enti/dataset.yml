root: "../../out"
schema_version: 1

dataset:
  # Seed dell'anagrafica enti BDAP — estratta dal dump Conto Annuale.
  # La versione 2024 è stabile; in futuro si potra' aggiornare annualmente.
  name: "ca_anag_enti_seed"
  years: [2024]

raw:
  sources:
    - name: "anagrafica_enti_csv"
      type: "local_file"
      args:
        path: "../../_local/seed/TipoIstituzione_Istituzione.CSV"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    mode: explicit
    header: true
    delim: ";"
    encoding: "utf-8"
  validate: {}

mart:
  tables:
    - name: "ca_anag_enti_seed"
      sql: "sql/mart.sql"
  required_tables: ["ca_anag_enti_seed"]
  validate: {}

validation:
  fail_on_error: true
