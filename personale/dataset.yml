root: "../out"
schema_version: 1

dataset:
  name: "personale"
  source_id: "openbdap"
  years: [2020, 2021, 2022, 2023, 2024]

raw:
  output_policy: overwrite
  sources:
    - name: "eta_csv"
      type: "local_file"
      args:
        path: "../_local/seed/dati/{year}/ETA_{year}.CSV"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    mode: latest
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 1000

mart:
  tables:
    - name: "personale_eta_comparti"
      sql: "sql/mart_eta.sql"
  required_tables:
    - "personale_eta_comparti"
  validate:
    table_rules:
      personale_eta_comparti:
        min_rows: 10

validation:
  fail_on_error: true

support:
  - name: "enti"
    config: "../anagrafica/anag-enti/dataset.yml"
    years: [2024]
  - name: "comparti"
    config: "../anagrafica/anag-comparti/dataset.yml"
    years: [2024]
  - name: "qualifiche"
    config: "../anagrafica/anag-qualifiche/dataset.yml"
    years: [2024]
