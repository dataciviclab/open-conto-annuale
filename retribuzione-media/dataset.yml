root: "../out"
schema_version: 1
dataset:
  name: "retribuzione_media"
  source_id: "openbdap"
  years: [2020, 2021, 2022, 2023, 2024]
raw:
  output_policy: overwrite
  sources:
    - name: "retribuzione_media_csv"
      type: "local_file"
      args:
        path: "../_local/seed/dati/{year}/RETRIBUZIONE_MEDIA_{year}.CSV"
      primary: true
clean:
  sql: "sql/clean.sql"
  read:
    mode: latest
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 100
mart:
  tables:
    - name: "retribuzione_media_comparti"
      sql: "sql/mart.sql"
  required_tables: ["retribuzione_media_comparti"]
  validate:
    table_rules:
      retribuzione_media_comparti: { min_rows: 5 }
validation:
  fail_on_error: true
support:
  - name: "enti"
    config: "../anagrafica/anag-enti/dataset.yml"
    years: [2024]
  - name: "comparti"
    config: "../anagrafica/anag-comparti/dataset.yml"
    years: [2024]
