root: "../out"
schema_version: 1

dataset:
  name: "costo_lavoro"
  source_id: "openbdap"
  years: [2020, 2021, 2022, 2023, 2024]

raw:
  output_policy: overwrite
  sources:
    - name: "costo_lavoro_csv"
      type: "local_file"
      args:
        path: "../_local/seed/dati/{year}/COSTO_LAVORO_{year}.CSV"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    mode: latest
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 1000

mart:
  tables:
    - name: "costo_lavoro_comparti"
      sql: "sql/mart_comparti.sql"
  required_tables:
    - "costo_lavoro_comparti"
  validate:
    table_rules:
      costo_lavoro_comparti:
        min_rows: 10

validation:
  fail_on_error: true

support:
  - name: "enti"
    config: "../anagrafica/anag-enti/dataset.yml"
    years: [2024]
  - name: "comparti"
    config: "../anagrafica/anag-comparti/dataset.yml"
    years: [2024]
  - name: "voci_spesa"
    config: "../anagrafica/anag-voci-spesa/dataset.yml"
    years: [2024]
