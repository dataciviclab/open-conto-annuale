root: "../../out"
schema_version: 1
dataset:
  name: "ca_anag_titoli_studio_seed"
  source_id: "openbdap"
  tags: [pa, conto-annuale, anagrafica, titoli-studio, support]
  category: pa
  description: "Anagrafica dei titoli di studio del Conto Annuale — dizionario di supporto."
  years: [2024]
raw:
  output_policy: overwrite
  sources:
    - name: "seed_csv"
      type: "local_file"
      args:
        path: "../../anagrafica/_data/Titoli_Studio.CSV"
      primary: true
clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: true
    delim: ";"
    encoding: "utf-8"
  required_columns:
    - anno
    - codi_titolo
    - desc_titolo
  validate:
    min_rows: 5
mart:
  tables:
    - name: "ca_anag_titoli_studio_seed"
      sql: "sql/mart.sql"
  required_tables: ["ca_anag_titoli_studio_seed"]
  validate:
    table_rules:
      ca_anag_titoli_studio_seed:
        required_columns: [anno, codi_titolo, desc_titolo]
        min_rows: 5
validation:
  fail_on_error: true
