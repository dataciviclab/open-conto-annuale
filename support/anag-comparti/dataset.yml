root: "../../out"
schema_version: 1

dataset:
  name: "ca_anag_comparti_seed"
  source_id: "openbdap"
  tags: [pa, conto-annuale, anagrafica, comparti, support]
  category: pa
  description: "Anagrafica dei comparti e contratti del Conto Annuale — dizionario di supporto."
  years: [2024]

raw:
  output_policy: overwrite
  sources:
    - name: "anagrafica_comparti_csv"
      type: "local_file"
      args:
        path: "../../anagrafica/_data/CompartoContratto.CSV"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: true
    delim: ";"
    encoding: "utf-8"
  required_columns:
    - anno
    - codi_comparto
    - desc_comparto
    - codi_contratto
    - desc_contratto
  validate:
    min_rows: 5

mart:
  tables:
    - name: "ca_anag_comparti_seed"
      sql: "sql/mart.sql"
  required_tables: ["ca_anag_comparti_seed"]
  validate:
    table_rules:
      ca_anag_comparti_seed:
        required_columns: [anno, codi_comparto, desc_comparto, codi_contratto]
        min_rows: 5

validation:
  fail_on_error: true
