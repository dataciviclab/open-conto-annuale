name: check
on:
  pull_request:
    paths: ["**/*.py", "**/*.yml", "**/*.yaml", "**/*.sql", "**/Makefile"]
  push:
    branches: [main]
    paths: ["**/*.py", "**/*.yml", "**/*.yaml", "**/*.sql", "**/Makefile"]

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install git+https://github.com/dataciviclab/lab-connectors.git
          pip install git+https://github.com/dataciviclab/toolkit.git
          pip install duckdb mcp pytest pytest-timeout

      - name: Validate all dataset configs
        run: |
          for cfg in $(find . -path '*/anagrafica/*' -name dataset.yml | sort); do
            echo "→ $cfg"
            python3 -m toolkit.cli.app inspect paths --config "$cfg" --year 2024 > /dev/null 2>&1
          done
          for d in assenze composizione-retribuzione costo-lavoro personale anzianita \
                   titoli-studio comandati contrattazione flessibili passaggi distribuzione \
                   retribuzione-media modalita-flessibile; do
            echo "→ $d/dataset.yml"
            python3 -m toolkit.cli.app inspect paths --config "$d/dataset.yml" --year 2024 > /dev/null 2>&1
          done
          echo "✅ All configs valid"
