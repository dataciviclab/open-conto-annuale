name: pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "support/**"
      - "scripts/**"
      - ".github/workflows/pipeline.yml"
  schedule:
    # Annuale: 1 giugno 06:00 UTC
    - cron: '0 6 1 6 *'
  workflow_dispatch:

concurrency:
  group: conto-annuale-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: conto-annuale
      run-command: make run-all
      verify-command: make verify
    secrets: inherit
