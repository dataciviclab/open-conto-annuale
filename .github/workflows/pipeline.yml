name: pipeline
on:
  schedule:
    # Annuale: 1 giugno — i dati del Conto Annuale vengono pubblicati da RGS
    # entro maggio dell'anno successivo.
    - cron: "0 6 1 6 *"
  workflow_dispatch:
    inputs:
      years:
        description: "Anni (es. 2024 o 2020,2021,2024 o all)"
        default: "all"
      smoke:
        description: "Smoke mode (--sample-rows 1000, root isolato)"
        default: false
        type: boolean

jobs:
  conto-annuale-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          pip install git+https://github.com/dataciviclab/lab-connectors.git
          pip install git+https://github.com/dataciviclab/toolkit.git

      - name: Download ZIP
        run: |
          if [ "${{ inputs.years }}" = "all" ]; then YEARS="2020 2021 2022 2023 2024"
          else YEARS=$(echo "${{ inputs.years }}" | tr ',' ' '); fi
          for y in $YEARS; do python3 scripts/download_zip.py $y; done

      - name: Extract data
        run: |
          if [ "${{ inputs.years }}" = "all" ]; then YEARS="2020 2021 2022 2023 2024"
          else YEARS=$(echo "${{ inputs.years }}" | tr ',' ' '); fi
          for y in $YEARS; do
            mkdir -p "_local/seed/dati/${y}"
            unzip -j -o "${y}Tutto.zip" "*${y}Dati/*" -d "_local/seed/dati/${y}/" 2>&1 | tail -1
          done

      - name: Seeds
        run: |
          SMOKE="${{ inputs.smoke && '--sample-rows 1000' || '' }}"
          for d in anagrafica/anag-enti anagrafica/anag-comparti anagrafica/anag-qualifiche \
                   anagrafica/anag-voci-spesa anagrafica/anag-causali anagrafica/anag-territorio \
                   anagrafica/anag-titoli-studio anagrafica/anag-voci-fua anagrafica/anag-fondi; do
            python3 scripts/run_toolkit.py run all --config "$d/dataset.yml" $SMOKE
          done

      - name: Run all datasets
        run: |
          SMOKE="${{ inputs.smoke && '--sample-rows 1000' || '' }}"
          if [ "${{ inputs.years }}" = "all" ]; then YEARS="2020 2021 2022 2023 2024"
          else YEARS=$(echo "${{ inputs.years }}" | tr ',' ' '); fi
          for ds in assenze composizione-retribuzione costo-lavoro personale anzianita \
                    titoli-studio comandati contrattazione flessibili passaggi distribuzione \
                    retribuzione-media modalita-flessibile occupazione; do
            for y in $YEARS; do
              python3 -c "import yaml; y=yaml.safe_load(open('${ds}/dataset.yml')); exit(0 if $y in y['dataset']['years'] else 1)" && echo "=== $ds $y ===" || { echo "  ⏭️ $ds salta $y (non configurato)"; continue; }
              python3 scripts/run_toolkit.py run all --config "${ds}/dataset.yml" --year "$y" $SMOKE
            done
          done

      - name: Verify output (gate)
        if: ${{ !inputs.smoke }}
        run: |
          YEARS="${{ inputs.years || 'all' }}"
          if [ "$YEARS" = "all" ]; then
            python3 scripts/verify_output.py --all --year 2024
            python3 scripts/verify_output.py --all --year 2023
          else
            for y in $(echo "$YEARS" | tr ',' ' '); do
              python3 scripts/verify_output.py --all --year "$y"
            done
          fi

      - name: Sync to GCS
        if: ${{ !inputs.smoke }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP_SA_KEY non configurata — salto GCS sync"
            exit 0
          fi
          echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json 2>/dev/null || echo "$GCP_SA_KEY" > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gsutil -m rsync -r out/data/mart/ gs://dataciviclab-mart/conto-annuale/
          gsutil -m rsync -r out/data/clean/ gs://dataciviclab-clean/conto-annuale/
