name: pipeline
on:
  schedule:
    # Annuale: 1 giugno — i dati del Conto Annuale vengono pubblicati da RGS
    # entro maggio dell'anno successivo.
    - cron: "0 6 1 6 *"
  workflow_dispatch:
    inputs:
      years:
        description: "Anni (es. 2024 o 2020,2021,2024 o all)"
        default: "all"

jobs:
  conto-annuale-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          pip install git+https://github.com/dataciviclab/lab-connectors.git
          pip install git+https://github.com/dataciviclab/toolkit.git

      - name: Download + extract data
        run: |
          if [ "${{ inputs.years }}" = "all" ]; then YEARS="2020 2021 2022 2023 2024"
          else YEARS=$(echo "${{ inputs.years }}" | tr ',' ' '); fi
          python3 scripts/extract_dati.py $YEARS

      - name: Seeds
        run: |
          for d in support/anag-enti support/anag-comparti support/anag-qualifiche \
                   support/anag-voci-spesa support/anag-causali support/anag-territorio \
                   support/anag-titoli-studio support/anag-voci-fua support/anag-fondi; do
            toolkit run --config "$d/dataset.yml"
          done

      - name: Run all datasets
        run: |
          if [ "${{ inputs.years }}" = "all" ]; then YEARS="2020 2021 2022 2023 2024"
          else YEARS=$(echo "${{ inputs.years }}" | tr ',' ' '); fi
          for ds in datasets/assenze datasets/composizione-retribuzione datasets/costo-lavoro \
                    datasets/personale datasets/anzianita datasets/titoli-studio \
                    datasets/comandati datasets/contrattazione datasets/flessibili \
                    datasets/passaggi datasets/distribuzione datasets/retribuzione-media \
                    datasets/modalita-flessibile datasets/occupazione; do
            for y in $YEARS; do
              python3 -c "import yaml; y=yaml.safe_load(open('${ds}/dataset.yml')); exit(0 if $y in y['dataset']['years'] else 1)" && echo "=== $ds $y ===" || { echo "  ⏭️ $ds salta $y (non configurato)"; continue; }
              toolkit run --config "${ds}/dataset.yml" --year "$y"
            done
          done

      - name: Verify output (gate)
        run: |
          YEARS="${{ inputs.years || 'all' }}"
          if [ "$YEARS" = "all" ]; then
            python3 scripts/verify_output.py --all --year 2024
            python3 scripts/verify_output.py --all --year 2023
          else
            for y in $(echo "$YEARS" | tr ',' ' '); do
              python3 scripts/verify_output.py --all --year "$y"
            done
          fi

      - name: Build registry
        run: python3 scripts/build_registry.py --write

      - name: Sync to GCS
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP_SA_KEY non configurata — salto GCS sync"
            exit 0
          fi
          echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json 2>/dev/null || echo "$GCP_SA_KEY" > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gsutil -m rsync -r out/data/mart/ gs://dataciviclab-mart/conto-annuale/
          gsutil -m rsync -r out/data/clean/ gs://dataciviclab-clean/conto-annuale/
