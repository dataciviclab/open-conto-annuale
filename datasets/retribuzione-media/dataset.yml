root: "../../out"
schema_version: 1

dataset:
  name: "retribuzione_media"
  source_id: "openbdap"
  tags: [pa, conto-annuale, retribuzione-media, dipendenti-pubblici]
  category: pa
  description: "Retribuzione media per componente stipendiale del personale delle PA italiane (2020-2024), arricchita con anagrafica enti e comparti."
  years: [2020, 2021, 2022, 2023, 2024]
  time_coverage:
    start_year: 2020
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "retribuzione_media_csv"
      type: "local_file"
      args:
        path: "../../_local/seed/dati/{year}/RETRIBUZIONE_MEDIA_{year}.CSV"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: true
    delim: ";"
    encoding: "utf-8"
  required_columns:
    - anno
    - istituzione
    - contratto
    - categoria
    - stipendio
    - ria
    - tredicesima
    - straordinario
    - indennita_fisse
    - altre_accessorie
    - codi_comparto
    - desc_comparto
  validate:
    min_rows: 100
    not_null:
      - anno
      - istituzione
      - contratto

mart:
  tables:
    - name: "retribuzione_media_comparti"
      sql: "sql/mart.sql"
  required_tables: ["retribuzione_media_comparti"]
  validate:
    table_rules:
      retribuzione_media_comparti:
        required_columns: [anno, codi_comparto, desc_comparto, categoria, avg_stipendio, avg_ria, avg_tredicesima, avg_straordinario, avg_indennita, avg_accessorie, enti]
        primary_key: [anno, codi_comparto, categoria]
        min_rows: 5

validation:
  fail_on_error: true

support:
  - name: "enti"
    config: "../../support/anag-enti/dataset.yml"
    years: [2024]
  - name: "comparti"
    config: "../../support/anag-comparti/dataset.yml"
    years: [2024]
